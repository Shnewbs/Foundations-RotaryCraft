name: Verify master
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/validate_assets.py
      - run: bash gradlew --no-daemon build
      - run: bash gradlew --no-daemon runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: tested-mod-jar
          path: build/libs/*.jar
          if-no-files-found: error
