name: Versioned release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require a release from master
        run: git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate tag and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python tools/release_notes.py "$RELEASE_TAG"
      - name: Validate assets
        run: python tools/validate_assets.py
      - name: Build and regression checks
        run: bash gradlew --no-daemon build
      - name: GameTests
        run: bash gradlew --no-daemon runGameTestServer
      - name: Publish mod JAR and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties)
          JAR="build/libs/Foundations-RotaryCraft-${VERSION}.jar"
          test -s "$JAR"
          (cd build/libs && sha256sum "Foundations-RotaryCraft-${VERSION}.jar" > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" "$JAR" build/libs/SHA256SUMS.txt --verify-tag --title "Foundations-RotaryCraft ${VERSION}" --notes-file release-notes.md --prerelease
