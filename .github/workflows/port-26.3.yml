name: Native 26.3 checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compat: [false, true]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash ports/26.3/gradlew -p ports/26.3 --no-daemon build -PcompatMods=${{ matrix.compat }}
      - run: bash ports/26.3/gradlew -p ports/26.3 --no-daemon runGameTestServer -PcompatMods=${{ matrix.compat }}
      - uses: actions/upload-artifact@v4
        if: ${{ !matrix.compat }}
        with:
          name: native-26.3-candidate
          path: ports/26.3/build/libs/*.jar
          if-no-files-found: error

  client-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libegl-mesa0 libegl1 mesa-vulkan-drivers
      - name: Bake native models and textures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          SDL_VIDEO_FORCE_EGL: '1'
          SDL_EGL_LIBRARY: 'libEGL.so.1'
        run: |
          set -o pipefail
          mkdir -p ports/26.3/run-visual
          printf 'accessibilityOnboarded:true\n' > ports/26.3/run-visual/options.txt
          timeout 240s xvfb-run -a -s "-screen 0 1280x720x24" bash ports/26.3/gradlew -p ports/26.3 --no-daemon runVisualSmokeClient -PcompatMods=true | tee native-visual.log
          grep ROTARYCRAFT_NATIVE_VISUAL_OK native-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-logs
          path: |
            native-visual.log
            ports/26.3/run-visual/logs/

  release:
    needs: [build, client-visual]
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: rotarycraft-publish-26.3
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Require a commit on master
        run: git merge-base --is-ancestor HEAD origin/master
      - name: Select unpublished version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PROPERTIES: ports/26.3/gradle.properties
        run: python tools/prepare_release.py
      - uses: actions/download-artifact@v4
        if: steps.version.outputs.publish == 'true'
        with:
          name: native-26.3-candidate
          path: ports/26.3/build/libs
      - name: Publish checked version
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_DRAFT: ${{ steps.version.outputs.draft }}
        run: |
          JAR="ports/26.3/build/libs/Foundations-RotaryCraft-${RELEASE_VERSION}.jar"
          test -s "$JAR"
          (cd ports/26.3/build/libs && sha256sum "Foundations-RotaryCraft-${RELEASE_VERSION}.jar" > SHA256SUMS.txt)
          if [ "$RELEASE_DRAFT" != 'true' ]; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Foundations-RotaryCraft-${RELEASE_VERSION}" --notes-file release-notes.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" "$JAR" ports/26.3/build/libs/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false
