name: Native 26.3 checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash ports/26.3/gradlew -p ports/26.3 --no-daemon build
      - run: bash ports/26.3/gradlew -p ports/26.3 --no-daemon runGameTestServer
      - uses: actions/upload-artifact@v4
        with:
          name: native-26.3-candidate
          path: ports/26.3/build/libs/*.jar
          if-no-files-found: error

  client-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Bake native models and textures
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -o pipefail
          mkdir -p ports/26.3/run-visual
          printf 'accessibilityOnboarded:true\n' > ports/26.3/run-visual/options.txt
          xvfb-run -a -s "-screen 0 1280x720x24" bash ports/26.3/gradlew -p ports/26.3 --no-daemon runVisualSmokeClient | tee native-visual.log
          grep ROTARYCRAFT_NATIVE_VISUAL_OK native-visual.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-client-logs
          path: |
            native-visual.log
            ports/26.3/run-visual/logs/
