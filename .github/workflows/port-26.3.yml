name: Native 26.3 checks
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: bash ports/26.3/gradlew -p ports/26.3 --no-daemon build
      - uses: actions/upload-artifact@v4
        with:
          name: native-26.3-candidate
          path: ports/26.3/build/libs/*.jar
          if-no-files-found: error
