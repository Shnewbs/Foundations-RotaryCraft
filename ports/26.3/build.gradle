plugins { id 'java-library'; id 'net.neoforged.moddev' version '2.0.147' }
version = mod_version
group = 'Foundations.RotaryCraft'
base { archivesName = 'Foundations-RotaryCraft' }
java.toolchain.languageVersion = JavaLanguageVersion.of(25)
neoForge {
    version = neo_version
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
        gameTestServer { type='gameTestServer'; systemProperty 'neoforge.enabledGameTestNamespaces','rotarycraft' }
        visualSmokeClient { client(); gameDirectory=file('run-visual'); systemProperty 'rotarycraft.visualSmoke','true'; programArguments.addAll('--width','1280','--height','720') }
    }
    mods { rotarycraft { sourceSet sourceSets.main } }
}
// Physics rules are compiled from the SAME sources on both Minecraft versions.
def shared = file('../../src/main/java/Foundations/RotaryCraft/Mechanical')
tasks.register('copySharedRules',Copy) {
    from(shared) { include 'ShaftPower.java','DcEngineState.java','PowerRequirement.java' }
    into layout.buildDirectory.dir('generated/shared/Foundations/RotaryCraft/Mechanical')
}
sourceSets.main.java.srcDir layout.buildDirectory.dir('generated/shared')
tasks.named('compileJava') { dependsOn 'copySharedRules' }
tasks.register('prepareVersionResources',Exec) {
    commandLine 'python3','../../tools/prepare_26_resources.py'
    inputs.dir '../../src/main/resources'; inputs.file '../../tools/prepare_26_resources.py'
    outputs.dir layout.buildDirectory.dir('generated/resources')
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/resources')
tasks.named('processResources') { dependsOn 'prepareVersionResources'; filesMatching('META-INF/neoforge.mods.toml'){expand([mod_version:mod_version,neo_version:neo_version])} }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
tasks.named('jar') { from '../../License.txt' }
