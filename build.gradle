plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = neo_version

    runs {
        client {
            client()
        }

        visualSmokeClient {
            client()
            gameDirectory = file('run-visual')
            systemProperty 'rotarycraft.visualSmoke', 'true'
            programArgument '--width'
            programArgument '1280'
            programArgument '--height'
            programArgument '720'
        }

        server {
            server()
            programArgument '--nogui'
        }

        gameTestServer {
            gameDirectory = file('run-gametest')
            type = 'gameTestServer'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    from('License.txt')
}

// Runs the dependency-free mechanical regression suite as part of every build.
tasks.register('verifyMechanicalPower', JavaExec) {
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'Foundations.RotaryCraft.Mechanical.MechanicalPowerTest'
}
tasks.named('check') { dependsOn tasks.named('verifyMechanicalPower') }

repositories {
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:19.57.0.450"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:19.57.0.450"
    compileOnly 'maven.modrinth:jade:15.10.6+neoforge'
    if (providers.gradleProperty('compatMods').getOrElse('false').toBoolean()) {
        runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.57.0.450"
        runtimeOnly 'maven.modrinth:jade:15.10.6+neoforge'
        runtimeOnly 'maven.modrinth:kubejs:2101.7.2-build.377'
        runtimeOnly 'maven.modrinth:rhino:2101.2.8-build.91+Rhino-1.21'
        runtimeOnly 'maven.modrinth:better-advanced-tooltips:2101.1.0-build.5'
    }
}
